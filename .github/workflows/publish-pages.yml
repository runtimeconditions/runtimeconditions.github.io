name: Publish site

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - extensions-updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out docs repo
        uses: actions/checkout@v6

      - name: Check out extensions repo
        uses: actions/checkout@v6
        with:
          repository: runtimeconditions/extensions
          path: extensions-src

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install prerequisites
        run: python -m pip install --disable-pip-version-check -r extensions-src/tooling/smithy-runtime-conditions/requirements.txt

      - name: Assemble site, this repo's pages plus the extensions catalog
        run: |
          mkdir -p _site
          for item in * .[!.]* ..?*; do
            case "$item" in
              _site|extensions-src|.github|.git) continue ;;
            esac
            [ -e "$item" ] || continue
            cp -r "$item" _site/
          done
          python extensions-src/tooling/common/build_extensions_site.py --output _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
